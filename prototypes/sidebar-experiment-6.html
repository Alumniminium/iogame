<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Experiment 6 - Vertical Split Dual-Pane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 340px;
            height: 90vh;
            display: flex;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        /* Activity Bar (Left Strip) */
        .activity-bar {
            width: 60px;
            background: var(--bg-activity);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .activity-button {
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: transparent;
            border: none;
            color: var(--text-muted);
            transition: all 0.2s ease;
            font-size: 24px;
            gap: 4px;
        }

        .activity-button:hover {
            background: var(--bg-hover);
            color: var(--accent);
        }

        .activity-button.active {
            color: var(--accent);
            background: var(--bg-active);
        }

        .activity-button.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 40px;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
        }

        .activity-label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .header-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box:focus {
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        /* Parts List */
        .parts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .part-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .part-item:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .part-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-icon);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 2px solid var(--accent);
        }

        .part-info {
            flex: 1;
            min-width: 0;
        }

        .part-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .part-stats {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Footer */
        .footer {
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .theme-button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .theme-button:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .theme-button.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px var(--bg-secondary);
        }

        /* Scrollbar */
        .parts-list::-webkit-scrollbar {
            width: 8px;
        }

        .parts-list::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .parts-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* Theme Variables */
        .sidebar[data-theme="cyan"] {
            --accent: #00d9ff;
            --bg-primary: #0a0e1a;
            --bg-secondary: #0d1117;
            --bg-activity: #050810;
            --bg-hover: rgba(0, 217, 255, 0.1);
            --bg-active: rgba(0, 217, 255, 0.15);
            --bg-input: #161b22;
            --bg-icon: rgba(0, 217, 255, 0.2);
            --border: rgba(0, 217, 255, 0.2);
            --text-primary: #ffffff;
            --text-muted: #8b949e;
        }

        .sidebar[data-theme="amber"] {
            --accent: #ffb800;
            --bg-primary: #1a1510;
            --bg-secondary: #1f1a13;
            --bg-activity: #14100a;
            --bg-hover: rgba(255, 184, 0, 0.1);
            --bg-active: rgba(255, 184, 0, 0.15);
            --bg-input: #242016;
            --bg-icon: rgba(255, 184, 0, 0.2);
            --border: rgba(255, 184, 0, 0.2);
            --text-primary: #ffffff;
            --text-muted: #a89c8a;
        }

        .sidebar[data-theme="purple"] {
            --accent: #b794f6;
            --bg-primary: #13111a;
            --bg-secondary: #1a1721;
            --bg-activity: #0d0b14;
            --bg-hover: rgba(183, 148, 246, 0.1);
            --bg-active: rgba(183, 148, 246, 0.15);
            --bg-input: #1f1c28;
            --bg-icon: rgba(183, 148, 246, 0.2);
            --border: rgba(183, 148, 246, 0.2);
            --text-primary: #ffffff;
            --text-muted: #9d94ab;
        }

        .sidebar[data-theme="green"] {
            --accent: #00ff88;
            --bg-primary: #0a1a13;
            --bg-secondary: #0d1f17;
            --bg-activity: #05140d;
            --bg-hover: rgba(0, 255, 136, 0.1);
            --bg-active: rgba(0, 255, 136, 0.15);
            --bg-input: #12241b;
            --bg-icon: rgba(0, 255, 136, 0.2);
            --border: rgba(0, 255, 136, 0.2);
            --text-primary: #ffffff;
            --text-muted: #8ba99c;
        }

        .sidebar[data-theme="red"] {
            --accent: #ff4444;
            --bg-primary: #1a0a0a;
            --bg-secondary: #1f0d0d;
            --bg-activity: #140505;
            --bg-hover: rgba(255, 68, 68, 0.1);
            --bg-active: rgba(255, 68, 68, 0.15);
            --bg-input: #241212;
            --bg-icon: rgba(255, 68, 68, 0.2);
            --border: rgba(255, 68, 68, 0.2);
            --text-primary: #ffffff;
            --text-muted: #a98b8b;
        }

        .sidebar[data-theme="mono"] {
            --accent: #ffffff;
            --bg-primary: #0d0d0d;
            --bg-secondary: #161616;
            --bg-activity: #080808;
            --bg-hover: rgba(255, 255, 255, 0.1);
            --bg-active: rgba(255, 255, 255, 0.15);
            --bg-input: #1a1a1a;
            --bg-icon: rgba(255, 255, 255, 0.2);
            --border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-muted: #8b8b8b;
        }
    </style>
</head>
<body>
    <div class="sidebar" data-theme="cyan">
        <!-- Activity Bar -->
        <div class="activity-bar">
            <button class="activity-button active" data-category="weapons">
                <span>⚔</span>
                <span class="activity-label">WPN</span>
            </button>
            <button class="activity-button" data-category="engines">
                <span>🚀</span>
                <span class="activity-label">ENG</span>
            </button>
            <button class="activity-button" data-category="shields">
                <span>🛡</span>
                <span class="activity-label">SLD</span>
            </button>
            <button class="activity-button" data-category="utility">
                <span>⚙</span>
                <span class="activity-label">UTL</span>
            </button>
            <button class="activity-button" data-category="special">
                <span>✦</span>
                <span class="activity-label">SPC</span>
            </button>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <div class="header">
                <div class="header-title" id="categoryTitle">WEAPONS</div>
                <input type="text" class="search-box" placeholder="Search parts...">
            </div>

            <div class="parts-list" id="partsList">
                <!-- Parts will be dynamically inserted -->
            </div>

            <div class="footer">
                <div class="theme-selector">
                    <button class="theme-button active" data-theme="cyan" style="background: linear-gradient(135deg, #00d9ff, #0088cc);"></button>
                    <button class="theme-button" data-theme="amber" style="background: linear-gradient(135deg, #ffb800, #cc8800);"></button>
                    <button class="theme-button" data-theme="purple" style="background: linear-gradient(135deg, #b794f6, #8855dd);"></button>
                    <button class="theme-button" data-theme="green" style="background: linear-gradient(135deg, #00ff88, #00cc66);"></button>
                    <button class="theme-button" data-theme="red" style="background: linear-gradient(135deg, #ff4444, #cc2222);"></button>
                    <button class="theme-button" data-theme="mono" style="background: linear-gradient(135deg, #ffffff, #888888);"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const parts = {
            weapons: [
                { name: 'Plasma Cannon', icon: '🔫', dmg: 45, rof: 2.5 },
                { name: 'Laser Array', icon: '⚡', dmg: 30, rof: 5.0 },
                { name: 'Missile Pod', icon: '🚀', dmg: 80, rof: 1.0 },
                { name: 'Rail Gun', icon: '━', dmg: 120, rof: 0.5 }
            ],
            engines: [
                { name: 'Ion Thruster', icon: '💨', thrust: 850, fuel: 12 },
                { name: 'Warp Drive', icon: '⚡', thrust: 1200, fuel: 25 },
                { name: 'Quantum Core', icon: '◉', thrust: 2000, fuel: 40 },
                { name: 'Impulse Engine', icon: '▶', thrust: 600, fuel: 8 }
            ],
            shields: [
                { name: 'Energy Shield', icon: '◯', str: 500, regen: 25 },
                { name: 'Plasma Barrier', icon: '◈', str: 800, regen: 15 },
                { name: 'Phase Shield', icon: '◇', str: 350, regen: 40 },
                { name: 'Kinetic Dampener', icon: '◊', str: 1000, regen: 10 }
            ],
            utility: [
                { name: 'Cargo Bay', icon: '📦', cap: 500, mass: 100 },
                { name: 'Scanner Array', icon: '📡', range: 1000, power: 50 },
                { name: 'Repair Drone', icon: '🔧', rate: 35, energy: 40 },
                { name: 'Cloak Device', icon: '👁', dur: 10, cooldown: 30 }
            ],
            special: [
                { name: 'EMP Burst', icon: '💥', radius: 200, cd: 45 },
                { name: 'Time Dilation', icon: '⏱', factor: 0.5, dur: 5 },
                { name: 'Teleporter', icon: '↔', range: 500, cd: 20 },
                { name: 'Gravity Well', icon: '●', pull: 80, dur: 8 }
            ]
        };

        let currentCategory = 'weapons';

        function renderParts(category) {
            const partsList = document.getElementById('partsList');
            const categoryData = parts[category];

            partsList.innerHTML = categoryData.map(part => {
                const stats = Object.entries(part).filter(([key]) => key !== 'name' && key !== 'icon');
                const statsHtml = stats.map(([key, value]) =>
                    `<span class="stat">${key.toUpperCase()}: ${value}</span>`
                ).join('');

                return `
                    <div class="part-item">
                        <div class="part-icon">${part.icon}</div>
                        <div class="part-info">
                            <div class="part-name">${part.name}</div>
                            <div class="part-stats">${statsHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Activity bar buttons
        document.querySelectorAll('.activity-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.activity-button').forEach(b => b.classList.remove('active'));
                button.classList.add('active');

                const category = button.dataset.category;
                currentCategory = category;

                document.getElementById('categoryTitle').textContent = category.toUpperCase();
                renderParts(category);
            });
        });

        // Theme buttons
        document.querySelectorAll('.theme-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.theme-button').forEach(b => b.classList.remove('active'));
                button.classList.add('active');

                const theme = button.dataset.theme;
                document.querySelector('.sidebar').dataset.theme = theme;
            });
        });

        // Initialize
        renderParts('weapons');
    </script>
</body>
</html>
