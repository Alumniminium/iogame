<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Experiment 11 - Diagonal Stripes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Theme System */
        body.theme-cyan {
            --accent-primary: #00d9ff;
            --accent-secondary: #0088aa;
            --accent-glow: rgba(0, 217, 255, 0.4);
        }
        body.theme-amber {
            --accent-primary: #ffa500;
            --accent-secondary: #cc8400;
            --accent-glow: rgba(255, 165, 0, 0.4);
        }
        body.theme-purple {
            --accent-primary: #a855f7;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(168, 85, 247, 0.4);
        }
        body.theme-green {
            --accent-primary: #10b981;
            --accent-secondary: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
        }
        body.theme-red {
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --accent-glow: rgba(239, 68, 68, 0.4);
        }
        body.theme-mono {
            --accent-primary: #ffffff;
            --accent-secondary: #888888;
            --accent-glow: rgba(255, 255, 255, 0.4);
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 350px;
            height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Diagonal stripe accents */
        .diagonal-stripes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 50px,
                rgba(255, 255, 255, 0.02) 50px,
                rgba(255, 255, 255, 0.02) 52px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Corner accents */
        .corner-accent {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-primary);
            z-index: 10;
        }
        .corner-accent.top-left {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }
        .corner-accent.top-right {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }
        .corner-accent.bottom-left {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
        }
        .corner-accent.bottom-right {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        /* Header */
        .header {
            padding: 25px 20px;
            border-bottom: 2px solid var(--accent-primary);
            position: relative;
            z-index: 5;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), transparent);
        }

        .header h2 {
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--accent-primary);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Diagonal category bands */
        .categories-diagonal {
            padding: 25px 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
            z-index: 5;
            background: rgba(0, 0, 0, 0.3);
        }

        .category-band {
            height: 40px;
            background: rgba(20, 20, 20, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding-left: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 100%, 20px 100%);
        }

        .category-band::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                transparent,
                var(--accent-glow),
                transparent
            );
            transition: left 0.5s ease;
        }

        .category-band:hover::before {
            left: 100%;
        }

        .category-band::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: var(--accent-primary);
            transition: width 0.3s ease;
        }

        .category-band:hover,
        .category-band.active {
            background: rgba(30, 30, 30, 0.9);
            border-color: var(--accent-primary);
        }

        .category-band.active::after {
            width: 4px;
        }

        .category-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .category-band:hover .category-label,
        .category-band.active .category-label {
            color: var(--accent-primary);
            letter-spacing: 4px;
        }

        /* Parts container */
        .parts-container {
            flex: 1;
            padding: 25px 20px;
            overflow-y: auto;
            position: relative;
            z-index: 5;
        }

        .parts-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .part-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        /* Diagonal accent stripe on each card */
        .part-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 3px;
            height: 200%;
            background: var(--accent-primary);
            opacity: 0;
            transform: rotate(-45deg);
            transition: opacity 0.3s ease;
        }

        .part-card:hover::before {
            opacity: 0.5;
        }

        .part-card:hover {
            background: rgba(30, 30, 30, 0.9);
            border-color: var(--accent-primary);
            transform: translateX(5px);
            box-shadow: -5px 5px 20px var(--accent-glow);
        }

        .part-shape {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .part-shape::after {
            content: '';
            position: absolute;
            inset: -5px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .part-card:hover .part-shape::after {
            border-color: var(--accent-primary);
            opacity: 0.3;
        }

        .shape {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 2;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transition: all 0.3s ease;
        }

        .part-card:hover .shape {
            stroke-width: 3;
        }

        .part-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .part-name {
            font-size: 12px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .part-type {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        .part-status {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        /* Theme selector */
        .theme-selector {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .theme-btn {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            transform: rotate(45deg);
            position: relative;
        }

        .theme-btn::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            transform: rotate(45deg) scale(1.2);
            border-color: #fff;
        }

        .theme-btn:hover::before {
            border-color: rgba(255, 255, 255, 0.3);
            inset: -8px;
        }

        .theme-btn.cyan { background: #00d9ff; }
        .theme-btn.amber { background: #ffa500; }
        .theme-btn.purple { background: #a855f7; }
        .theme-btn.green { background: #10b981; }
        .theme-btn.red { background: #ef4444; }
        .theme-btn.mono { background: #ffffff; }

        /* Scrollbar */
        .parts-container::-webkit-scrollbar {
            width: 5px;
        }

        .parts-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .parts-container::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
        }

        /* Hide parts that don't match filter */
        .part-card.hidden {
            display: none;
        }

        /* Animated scanline */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.3;
            animation: scan 5s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="theme-cyan">
    <div class="sidebar">
        <div class="diagonal-stripes"></div>
        <div class="corner-accent top-left"></div>
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>
        <div class="corner-accent bottom-right"></div>
        <div class="scanline"></div>

        <div class="header">
            <h2>Part Library</h2>
        </div>

        <div class="categories-diagonal">
            <div class="category-band active" data-category="all">
                <div class="category-label">All Parts</div>
            </div>
            <div class="category-band" data-category="PWR">
                <div class="category-label">Power Systems</div>
            </div>
            <div class="category-band" data-category="DEF">
                <div class="category-label">Defense Grid</div>
            </div>
            <div class="category-band" data-category="OFF">
                <div class="category-label">Offensive Array</div>
            </div>
            <div class="category-band" data-category="MOB">
                <div class="category-label">Mobility Core</div>
            </div>
        </div>

        <div class="parts-container">
            <div class="parts-grid">
                <div class="part-card" data-type="PWR">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <rect class="shape" x="15" y="15" width="30" height="30" />
                        </svg>
                    </div>
                    <div class="part-info">
                        <div class="part-name">Generator</div>
                        <div class="part-type">PWR-CORE-01</div>
                        <div class="part-status">OPERATIONAL</div>
                    </div>
                </div>

                <div class="part-card" data-type="DEF">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <circle class="shape" cx="30" cy="30" r="15" />
                        </svg>
                    </div>
                    <div class="part-info">
                        <div class="part-name">Shield</div>
                        <div class="part-type">DEF-GRID-02</div>
                        <div class="part-status">OPERATIONAL</div>
                    </div>
                </div>

                <div class="part-card" data-type="OFF">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <polygon class="shape" points="30,15 45,45 15,45" />
                        </svg>
                    </div>
                    <div class="part-info">
                        <div class="part-name">Weapon</div>
                        <div class="part-type">OFF-ARM-03</div>
                        <div class="part-status">OPERATIONAL</div>
                    </div>
                </div>

                <div class="part-card" data-type="MOB">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <polygon class="shape" points="30,45 45,15 15,15" />
                        </svg>
                    </div>
                    <div class="part-info">
                        <div class="part-name">Engine</div>
                        <div class="part-type">MOB-THRUST-04</div>
                        <div class="part-status">OPERATIONAL</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="theme-selector">
            <div class="theme-btn cyan" data-theme="cyan"></div>
            <div class="theme-btn amber" data-theme="amber"></div>
            <div class="theme-btn purple" data-theme="purple"></div>
            <div class="theme-btn green" data-theme="green"></div>
            <div class="theme-btn red" data-theme="red"></div>
            <div class="theme-btn mono" data-theme="mono"></div>
        </div>
    </div>

    <script>
        // Theme switching
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.body.className = `theme-${theme}`;
            });
        });

        // Category filtering
        document.querySelectorAll('.category-band').forEach(band => {
            band.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.category-band').forEach(b => b.classList.remove('active'));
                band.classList.add('active');

                // Filter parts
                const category = band.dataset.category;
                const parts = document.querySelectorAll('.part-card');
                parts.forEach(part => {
                    if (category === 'all' || part.dataset.type === category) {
                        part.classList.remove('hidden');
                    } else {
                        part.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
