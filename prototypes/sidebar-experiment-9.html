<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Experiment 9 - Segmented Radial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Theme System */
        body.theme-cyan {
            --accent-primary: #00d9ff;
            --accent-secondary: #0088aa;
            --accent-glow: rgba(0, 217, 255, 0.4);
        }
        body.theme-amber {
            --accent-primary: #ffa500;
            --accent-secondary: #cc8400;
            --accent-glow: rgba(255, 165, 0, 0.4);
        }
        body.theme-purple {
            --accent-primary: #a855f7;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(168, 85, 247, 0.4);
        }
        body.theme-green {
            --accent-primary: #10b981;
            --accent-secondary: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
        }
        body.theme-red {
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --accent-glow: rgba(239, 68, 68, 0.4);
        }
        body.theme-mono {
            --accent-primary: #ffffff;
            --accent-secondary: #888888;
            --accent-glow: rgba(255, 255, 255, 0.4);
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 340px;
            height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--accent-primary);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* Top accent bar with diagonal cut */
        .top-accent {
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
            position: relative;
        }

        /* Corner brackets */
        .sidebar::before,
        .sidebar::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-primary);
            z-index: 10;
        }
        .sidebar::before {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }
        .sidebar::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        /* Header */
        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .header h2 {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        /* Radial category selector */
        .category-radial {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 180px;
        }

        .radial-container {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .radial-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--accent-primary);
            z-index: 5;
        }

        .category-segment {
            position: absolute;
            width: 70px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
        }

        .category-segment:hover {
            background: rgba(40, 40, 40, 0.9);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.1);
        }

        .category-segment.active {
            background: var(--accent-primary);
            color: #000;
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Position segments in a circle */
        .category-segment:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .category-segment:nth-child(2) { top: 25%; right: 10px; }
        .category-segment:nth-child(3) { bottom: 25%; right: 10px; }
        .category-segment:nth-child(4) { bottom: 0; left: 50%; transform: translateX(-50%); }
        .category-segment:nth-child(5) { top: 50%; left: 0; transform: translateY(-50%); }

        /* Parts container */
        .parts-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .parts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .part-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }

        .part-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            transition: left 0.5s ease;
        }

        .part-card:hover::before {
            left: 100%;
        }

        .part-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .part-shape {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .shape {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 2;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transition: all 0.3s ease;
        }

        .part-card:hover .shape {
            stroke-width: 3;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        .part-name {
            font-size: 11px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .part-type {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        /* Scanline effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
            opacity: 0.3;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Theme selector */
        .theme-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .theme-btn {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        .theme-btn:hover {
            transform: scale(1.2);
            border-color: #fff;
        }

        .theme-btn.cyan { background: #00d9ff; }
        .theme-btn.amber { background: #ffa500; }
        .theme-btn.purple { background: #a855f7; }
        .theme-btn.green { background: #10b981; }
        .theme-btn.red { background: #ef4444; }
        .theme-btn.mono { background: #ffffff; }

        /* Scrollbar */
        .parts-container::-webkit-scrollbar {
            width: 6px;
        }

        .parts-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .parts-container::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        /* Hide parts that don't match filter */
        .part-card.hidden {
            display: none;
        }
    </style>
</head>
<body class="theme-cyan">
    <div class="sidebar">
        <div class="top-accent"></div>
        <div class="scanline"></div>

        <div class="header">
            <h2>Part Library</h2>
        </div>

        <div class="theme-selector">
            <div class="theme-btn cyan" data-theme="cyan"></div>
            <div class="theme-btn amber" data-theme="amber"></div>
            <div class="theme-btn purple" data-theme="purple"></div>
            <div class="theme-btn green" data-theme="green"></div>
            <div class="theme-btn red" data-theme="red"></div>
            <div class="theme-btn mono" data-theme="mono"></div>
        </div>

        <div class="category-radial">
            <div class="radial-container">
                <div class="radial-center">ALL</div>
                <div class="category-segment active" data-category="all">ALL</div>
                <div class="category-segment" data-category="PWR">PWR</div>
                <div class="category-segment" data-category="DEF">DEF</div>
                <div class="category-segment" data-category="OFF">OFF</div>
                <div class="category-segment" data-category="MOB">MOB</div>
            </div>
        </div>

        <div class="parts-container">
            <div class="parts-grid">
                <div class="part-card" data-type="PWR">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <rect class="shape" x="10" y="10" width="40" height="40" />
                        </svg>
                    </div>
                    <div class="part-name">Generator</div>
                    <div class="part-type">PWR</div>
                </div>

                <div class="part-card" data-type="DEF">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <circle class="shape" cx="30" cy="30" r="20" />
                        </svg>
                    </div>
                    <div class="part-name">Shield</div>
                    <div class="part-type">DEF</div>
                </div>

                <div class="part-card" data-type="OFF">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <polygon class="shape" points="30,10 50,50 10,50" />
                        </svg>
                    </div>
                    <div class="part-name">Weapon</div>
                    <div class="part-type">OFF</div>
                </div>

                <div class="part-card" data-type="MOB">
                    <div class="part-shape">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <polygon class="shape" points="30,50 50,10 10,10" />
                        </svg>
                    </div>
                    <div class="part-name">Engine</div>
                    <div class="part-type">MOB</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme switching
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.body.className = `theme-${theme}`;
            });
        });

        // Category filtering
        document.querySelectorAll('.category-segment').forEach(segment => {
            segment.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.category-segment').forEach(s => s.classList.remove('active'));
                segment.classList.add('active');

                // Update center display
                const category = segment.dataset.category;
                document.querySelector('.radial-center').textContent = category;

                // Filter parts
                const parts = document.querySelectorAll('.part-card');
                parts.forEach(part => {
                    if (category === 'all' || part.dataset.type === category) {
                        part.classList.remove('hidden');
                    } else {
                        part.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
