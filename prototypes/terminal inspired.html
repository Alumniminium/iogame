<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Experiment 7 - Bottom Tabs Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 340px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            border: 2px solid var(--accent);
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
            position: relative;
        }

        /* Terminal Header */
        .terminal-header {
            background: var(--bg-header);
            padding: 12px 16px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-title {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .terminal-controls {
            display: flex;
            gap: 8px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid var(--accent);
        }

        .terminal-dot:nth-child(1) { background: var(--accent); }
        .terminal-dot:nth-child(2) { opacity: 0.5; }
        .terminal-dot:nth-child(3) { opacity: 0.3; }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-primary);
            position: relative;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: var(--accent);
            font-size: 12px;
        }

        .prompt-symbol {
            color: var(--accent);
            font-weight: 700;
        }

        .prompt-text {
            color: var(--text-primary);
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--accent);
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Part Cards */
        .part-card {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .part-card::before {
            content: '>';
            position: absolute;
            left: 8px;
            top: 8px;
            color: var(--accent);
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .part-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent-bright);
            transform: translateX(4px);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .part-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .card-icon {
            font-size: 20px;
            opacity: 0.8;
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat-line {
            display: flex;
            gap: 4px;
        }

        .stat-key {
            color: var(--accent);
        }

        .stat-value {
            color: var(--text-primary);
        }

        /* Bottom Tab Bar */
        .tab-bar {
            background: var(--bg-tabs);
            border-top: 2px solid var(--accent);
            display: flex;
            height: 48px;
        }

        .tab {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab:last-child {
            border-right: none;
        }

        .tab:hover {
            background: var(--bg-hover);
            color: var(--accent);
        }

        .tab.active {
            background: var(--bg-primary);
            color: var(--accent);
            border-top: 2px solid var(--accent);
            margin-top: -2px;
        }

        .tab.active::before {
            content: '▲';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: var(--accent);
        }

        /* Theme Selector */
        .theme-bar {
            background: var(--bg-header);
            border-top: 1px solid var(--border);
            padding: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .theme-button {
            width: 24px;
            height: 24px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-button:hover {
            transform: scale(1.15);
            border-color: var(--accent);
        }

        .theme-button.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Scrollbar */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--accent);
            border: 1px solid var(--bg-primary);
        }

        /* Theme Variables */
        .sidebar[data-theme="cyan"] {
            --accent: #00ffff;
            --accent-bright: #44ffff;
            --accent-glow: rgba(0, 255, 255, 0.3);
            --bg-primary: #001a1a;
            --bg-header: #002020;
            --bg-card: #002828;
            --bg-tabs: #001414;
            --bg-hover: rgba(0, 255, 255, 0.1);
            --border: rgba(0, 255, 255, 0.3);
            --text-primary: #00ffff;
            --text-muted: #008888;
        }

        .sidebar[data-theme="amber"] {
            --accent: #ffaa00;
            --accent-bright: #ffcc44;
            --accent-glow: rgba(255, 170, 0, 0.3);
            --bg-primary: #1a1400;
            --bg-header: #201800;
            --bg-card: #282000;
            --bg-tabs: #140e00;
            --bg-hover: rgba(255, 170, 0, 0.1);
            --border: rgba(255, 170, 0, 0.3);
            --text-primary: #ffaa00;
            --text-muted: #886600;
        }

        .sidebar[data-theme="purple"] {
            --accent: #dd88ff;
            --accent-bright: #ee99ff;
            --accent-glow: rgba(221, 136, 255, 0.3);
            --bg-primary: #1a001a;
            --bg-header: #220022;
            --bg-card: #2a002a;
            --bg-tabs: #140014;
            --bg-hover: rgba(221, 136, 255, 0.1);
            --border: rgba(221, 136, 255, 0.3);
            --text-primary: #dd88ff;
            --text-muted: #884488;
        }

        .sidebar[data-theme="green"] {
            --accent: #00ff00;
            --accent-bright: #44ff44;
            --accent-glow: rgba(0, 255, 0, 0.3);
            --bg-primary: #001a00;
            --bg-header: #002000;
            --bg-card: #002800;
            --bg-tabs: #001400;
            --bg-hover: rgba(0, 255, 0, 0.1);
            --border: rgba(0, 255, 0, 0.3);
            --text-primary: #00ff00;
            --text-muted: #008800;
        }

        .sidebar[data-theme="red"] {
            --accent: #ff0000;
            --accent-bright: #ff4444;
            --accent-glow: rgba(255, 0, 0, 0.3);
            --bg-primary: #1a0000;
            --bg-header: #200000;
            --bg-card: #280000;
            --bg-tabs: #140000;
            --bg-hover: rgba(255, 0, 0, 0.1);
            --border: rgba(255, 0, 0, 0.3);
            --text-primary: #ff0000;
            --text-muted: #880000;
        }

        .sidebar[data-theme="mono"] {
            --accent: #ffffff;
            --accent-bright: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.3);
            --bg-primary: #0a0a0a;
            --bg-header: #141414;
            --bg-card: #1a1a1a;
            --bg-tabs: #0a0a0a;
            --bg-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --text-muted: #666666;
        }
    </style>
</head>
<body>
    <div class="sidebar" data-theme="cyan">
        <div class="terminal-header">
            <div class="terminal-title">SHIP_PARTS.SYS</div>
            <div class="terminal-controls">
                <div class="terminal-dot"></div>
                <div class="terminal-dot"></div>
                <div class="terminal-dot"></div>
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <div class="prompt-line">
                <span class="prompt-symbol">$</span>
                <span class="prompt-text">ls -la /parts/<span id="currentCategory">weapons</span></span>
                <span class="cursor"></span>
            </div>
            <div id="partsList"></div>
        </div>

        <div class="theme-bar">
            <button class="theme-button active" data-theme="cyan" title="CYAN">█</button>
            <button class="theme-button" data-theme="amber" title="AMBER">█</button>
            <button class="theme-button" data-theme="purple" title="PURPLE">█</button>
            <button class="theme-button" data-theme="green" title="GREEN">█</button>
            <button class="theme-button" data-theme="red" title="RED">█</button>
            <button class="theme-button" data-theme="mono" title="MONO">█</button>
        </div>

        <div class="tab-bar">
            <button class="tab active" data-category="weapons">wpn</button>
            <button class="tab" data-category="engines">eng</button>
            <button class="tab" data-category="shields">shd</button>
            <button class="tab" data-category="utility">utl</button>
            <button class="tab" data-category="special">spc</button>
        </div>
    </div>

    <script>
        const parts = {
            weapons: [
                { name: 'PLASMA_CANNON', icon: '⚡', dmg: 45, rof: 2.5, energy: 80, mass: 120 },
                { name: 'LASER_ARRAY', icon: '━', dmg: 30, rof: 5.0, energy: 50, mass: 80 },
                { name: 'MISSILE_POD', icon: '◆', dmg: 80, rof: 1.0, energy: 100, mass: 200 },
                { name: 'RAIL_GUN', icon: '═', dmg: 120, rof: 0.5, energy: 150, mass: 250 }
            ],
            engines: [
                { name: 'ION_THRUSTER', icon: '▶', thrust: 850, fuel: 12, heat: 45, mass: 300 },
                { name: 'WARP_DRIVE', icon: '»', thrust: 1200, fuel: 25, heat: 80, mass: 500 },
                { name: 'QUANTUM_CORE', icon: '◉', thrust: 2000, fuel: 40, heat: 120, mass: 800 },
                { name: 'IMPULSE_ENG', icon: '►', thrust: 600, fuel: 8, heat: 30, mass: 200 }
            ],
            shields: [
                { name: 'ENERGY_SHIELD', icon: '○', str: 500, regen: 25, power: 60, mass: 150 },
                { name: 'PLASMA_BARRIER', icon: '◎', str: 800, regen: 15, power: 90, mass: 220 },
                { name: 'PHASE_SHIELD', icon: '◇', str: 350, regen: 40, power: 45, mass: 100 },
                { name: 'KINETIC_DAMP', icon: '◊', str: 1000, regen: 10, power: 110, mass: 280 }
            ],
            utility: [
                { name: 'CARGO_BAY', icon: '▣', cap: 500, mass: 100, slots: 8, power: 10 },
                { name: 'SCANNER_ARRAY', icon: '⊕', range: 1000, power: 50, res: 90, mass: 80 },
                { name: 'REPAIR_DRONE', icon: '⚙', rate: 35, energy: 40, qty: 4, mass: 60 },
                { name: 'CLOAK_DEVICE', icon: '▢', dur: 10, cd: 30, power: 200, mass: 120 }
            ],
            special: [
                { name: 'EMP_BURST', icon: '※', radius: 200, cd: 45, dmg: 0, mass: 90 },
                { name: 'TIME_DILATION', icon: '⏱', factor: 0.5, dur: 5, cd: 60, mass: 150 },
                { name: 'TELEPORTER', icon: '⇄', range: 500, cd: 20, energy: 180, mass: 110 },
                { name: 'GRAVITY_WELL', icon: '●', pull: 80, dur: 8, radius: 300, mass: 200 }
            ]
        };

        let currentCategory = 'weapons';

        function renderParts(category) {
            const partsList = document.getElementById('partsList');
            const categoryData = parts[category];

            partsList.innerHTML = categoryData.map(part => {
                const stats = Object.entries(part).filter(([key]) => key !== 'name' && key !== 'icon');
                const statsHtml = stats.map(([key, value]) =>
                    `<div class="stat-line">
                        <span class="stat-key">${key}:</span>
                        <span class="stat-value">${value}</span>
                    </div>`
                ).join('');

                return `
                    <div class="part-card">
                        <div class="card-header">
                            <div class="card-title">${part.name}</div>
                            <div class="card-icon">${part.icon}</div>
                        </div>
                        <div class="card-stats">${statsHtml}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('currentCategory').textContent = category;
            document.getElementById('contentArea').scrollTop = 0;
        }

        // Tab buttons
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const category = tab.dataset.category;
                currentCategory = category;
                renderParts(category);
            });
        });

        // Theme buttons
        document.querySelectorAll('.theme-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.theme-button').forEach(b => b.classList.remove('active'));
                button.classList.add('active');

                const theme = button.dataset.theme;
                document.querySelector('.sidebar').dataset.theme = theme;
            });
        });

        // Initialize
        renderParts('weapons');
    </script>
</body>
</html>
