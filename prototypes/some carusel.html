<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Carousel Part Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .theme-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .theme-btn.active {
            background: rgba(0, 255, 255, 0.3);
            border-color: cyan;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .category-btn {
            padding: 10px 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            font-size: 1em;
            font-weight: bold;
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }

        .carousel-container {
            flex: 1;
            position: relative;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-stage {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .part-item {
            position: absolute;
            width: 280px;
            height: 350px;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .part-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .part-item.center .part-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.6), 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        .part-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            transition: all 0.3s;
        }

        .part-item.center .part-icon {
            width: 160px;
            height: 160px;
            font-size: 6em;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        .part-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            transition: all 0.3s;
        }

        .part-item.center .part-name {
            font-size: 1.8em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .part-category {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .part-stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .part-item.center .part-stats {
            opacity: 1;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .stat-label {
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #4ade80;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 100;
        }

        .carousel-arrow {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: all;
            backdrop-filter: blur(10px);
        }

        .carousel-arrow:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .carousel-arrow svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .reflection {
            position: absolute;
            bottom: -100px;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .info-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            min-width: 300px;
        }

        .info-title {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .part-item.center {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>3D CAROUSEL PART SELECTOR</h1>
        <div class="theme-selector">
            <button class="theme-btn active" data-theme="cyber">Cyber</button>
            <button class="theme-btn" data-theme="military">Military</button>
            <button class="theme-btn" data-theme="organic">Organic</button>
            <button class="theme-btn" data-theme="industrial">Industrial</button>
            <button class="theme-btn" data-theme="alien">Alien</button>
            <button class="theme-btn" data-theme="steampunk">Steampunk</button>
        </div>
    </div>

    <div class="main-container">
        <div class="category-filter">
            <button class="category-btn active" data-category="all">All Parts</button>
            <button class="category-btn" data-category="weapon">Weapons</button>
            <button class="category-btn" data-category="engine">Engines</button>
            <button class="category-btn" data-category="armor">Armor</button>
            <button class="category-btn" data-category="utility">Utility</button>
        </div>

        <div class="carousel-container">
            <div class="carousel-stage" id="carouselStage"></div>

            <div class="carousel-controls">
                <button class="carousel-arrow" id="prevBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <button class="carousel-arrow" id="nextBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>

            <div class="reflection"></div>

            <div class="info-panel">
                <div class="info-title">Use arrows or drag to rotate</div>
                <div class="info-value" id="infoText">Explore Ship Parts</div>
            </div>
        </div>
    </div>

    <script>
        const PARTS_DATA = [
            { id: 1, name: 'Plasma Cannon', category: 'weapon', icon: '🔫', theme: 'cyber', stats: { damage: 85, speed: 7, energy: 65 } },
            { id: 2, name: 'Laser Turret', category: 'weapon', icon: '⚡', theme: 'cyber', stats: { damage: 72, speed: 9, energy: 55 } },
            { id: 3, name: 'Missile Pod', category: 'weapon', icon: '🚀', theme: 'military', stats: { damage: 95, speed: 4, energy: 80 } },
            { id: 4, name: 'Ion Engine', category: 'engine', icon: '🔥', theme: 'cyber', stats: { thrust: 90, efficiency: 85, heat: 60 } },
            { id: 5, name: 'Warp Drive', category: 'engine', icon: '⚙️', theme: 'alien', stats: { thrust: 75, efficiency: 95, heat: 40 } },
            { id: 6, name: 'Combustion Engine', category: 'engine', icon: '💨', theme: 'industrial', stats: { thrust: 80, efficiency: 70, heat: 85 } },
            { id: 7, name: 'Energy Shield', category: 'armor', icon: '🛡️', theme: 'cyber', stats: { defense: 90, regen: 60, capacity: 85 } },
            { id: 8, name: 'Titanium Plating', category: 'armor', icon: '⬡', theme: 'industrial', stats: { defense: 95, regen: 20, capacity: 75 } },
            { id: 9, name: 'Bio-Armor', category: 'armor', icon: '🦠', theme: 'organic', stats: { defense: 80, regen: 90, capacity: 70 } },
            { id: 10, name: 'Radar Array', category: 'utility', icon: '📡', theme: 'military', stats: { range: 95, accuracy: 85, power: 45 } },
            { id: 11, name: 'Cloaking Device', category: 'utility', icon: '👁️', theme: 'alien', stats: { stealth: 90, duration: 60, power: 80 } },
            { id: 12, name: 'Repair Drone', category: 'utility', icon: '🔧', theme: 'industrial', stats: { repair: 85, speed: 70, power: 55 } },
            { id: 13, name: 'Rail Gun', category: 'weapon', icon: '⚔️', theme: 'military', stats: { damage: 100, speed: 5, energy: 90 } },
            { id: 14, name: 'Pulse Beam', category: 'weapon', icon: '✨', theme: 'alien', stats: { damage: 70, speed: 10, energy: 50 } },
            { id: 15, name: 'Steam Cannon', category: 'weapon', icon: '💥', theme: 'steampunk', stats: { damage: 78, speed: 6, energy: 70 } },
            { id: 16, name: 'Fusion Core', category: 'engine', icon: '☢️', theme: 'cyber', stats: { thrust: 100, efficiency: 80, heat: 95 } },
        ];

        let currentRotation = 0;
        let targetRotation = 0;
        let currentTheme = 'cyber';
        let currentCategory = 'all';
        let filteredParts = [...PARTS_DATA];
        let isDragging = false;
        let startX = 0;
        let startRotation = 0;

        const carouselStage = document.getElementById('carouselStage');
        const infoText = document.getElementById('infoText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function filterParts() {
            filteredParts = PARTS_DATA.filter(part => {
                const themeMatch = currentTheme === 'all' || part.theme === currentTheme;
                const categoryMatch = currentCategory === 'all' || part.category === currentCategory;
                return themeMatch && categoryMatch;
            });

            if (filteredParts.length === 0) {
                filteredParts = [...PARTS_DATA];
            }

            renderCarousel();
        }

        function renderCarousel() {
            carouselStage.innerHTML = '';

            filteredParts.forEach((part, index) => {
                const partElement = document.createElement('div');
                partElement.className = 'part-item';
                partElement.dataset.index = index;

                const statsEntries = Object.entries(part.stats);
                const statsHTML = statsEntries.map(([key, value]) => `
                    <div class="stat">
                        <div class="stat-label">${key}</div>
                        <div class="stat-value">${value}</div>
                    </div>
                `).join('');

                partElement.innerHTML = `
                    <div class="part-card">
                        <div class="part-icon">${part.icon}</div>
                        <div class="part-name">${part.name}</div>
                        <div class="part-category">${part.category}</div>
                        <div class="part-stats">
                            ${statsHTML}
                        </div>
                    </div>
                `;

                partElement.addEventListener('click', () => {
                    const clickedIndex = parseInt(partElement.dataset.index);
                    const centerIndex = Math.round(-currentRotation / (360 / filteredParts.length)) % filteredParts.length;
                    const normalizedCenter = centerIndex < 0 ? centerIndex + filteredParts.length : centerIndex;

                    if (clickedIndex !== normalizedCenter) {
                        let diff = clickedIndex - normalizedCenter;
                        if (Math.abs(diff) > filteredParts.length / 2) {
                            diff = diff > 0 ? diff - filteredParts.length : diff + filteredParts.length;
                        }
                        targetRotation = currentRotation - (diff * 360 / filteredParts.length);
                    }
                });

                carouselStage.appendChild(partElement);
            });

            updateCarousel();
        }

        function updateCarousel() {
            const parts = carouselStage.querySelectorAll('.part-item');
            const angleStep = 360 / filteredParts.length;
            const radius = 500;

            let centerIndex = Math.round(-currentRotation / angleStep) % filteredParts.length;
            if (centerIndex < 0) centerIndex += filteredParts.length;

            parts.forEach((part, index) => {
                const angle = (currentRotation + index * angleStep) * Math.PI / 180;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius - radius;

                const scale = 0.4 + (Math.cos(angle) * 0.3 + 0.3);
                const opacity = 0.3 + (Math.cos(angle) * 0.35 + 0.35);

                const isCenter = index === centerIndex;

                if (isCenter) {
                    part.classList.add('center');
                    const partData = filteredParts[index];
                    infoText.textContent = `${partData.name} - ${partData.category.toUpperCase()}`;
                } else {
                    part.classList.remove('center');
                }

                part.style.transform = `
                    translate(-50%, -50%)
                    translateX(${x}px)
                    translateZ(${z}px)
                    scale(${scale})
                `;
                part.style.opacity = opacity;
                part.style.zIndex = Math.round(z);
            });
        }

        function animate() {
            const diff = targetRotation - currentRotation;
            if (Math.abs(diff) > 0.1) {
                currentRotation += diff * 0.1;
                updateCarousel();
            }
            requestAnimationFrame(animate);
        }

        prevBtn.addEventListener('click', () => {
            targetRotation += 360 / filteredParts.length;
        });

        nextBtn.addEventListener('click', () => {
            targetRotation -= 360 / filteredParts.length;
        });

        carouselStage.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startRotation = targetRotation;
            carouselStage.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startX;
                targetRotation = startRotation + deltaX * 0.3;
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                carouselStage.style.cursor = 'grab';

                const angleStep = 360 / filteredParts.length;
                const snappedRotation = Math.round(targetRotation / angleStep) * angleStep;
                targetRotation = snappedRotation;
            }
        });

        carouselStage.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetRotation += e.deltaY * 0.1;
        });

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                filterParts();
            });
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                targetRotation = 0;
                currentRotation = 0;
                filterParts();
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                targetRotation += 360 / filteredParts.length;
            } else if (e.key === 'ArrowRight') {
                targetRotation -= 360 / filteredParts.length;
            }
        });

        carouselStage.style.cursor = 'grab';
        filterParts();
        animate();
    </script>
</body>
</html>
