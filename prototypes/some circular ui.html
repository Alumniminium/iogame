<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Interface - Ship Part Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #16213e;
            --bg-secondary: #0f3460;
            --bg-tertiary: #1a4d7a;
            --bg-body: #1a1a2e;
            --accent-primary: #00d9ff;
            --accent-gradient-start: #00d9ff;
            --accent-gradient-end: #0f3460;
            --text-primary: #eee;
            --text-secondary: #6b7c8f;
            --border-color: #0f3460;
            --shape-box: #00d9ff;
            --shape-circle: #00ff88;
            --shape-triangle: #ff6b6b;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 2px var(--accent-primary))
                        drop-shadow(0 0 4px var(--accent-primary));
            }
            50% {
                filter: drop-shadow(0 0 6px var(--accent-primary))
                        drop-shadow(0 0 12px var(--accent-primary));
            }
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 40px;
            overflow: hidden;
        }

        /* Main Orbital Container */
        .orbital-interface {
            width: 600px;
            height: 600px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Central Hub */
        .central-hub {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border: 3px solid var(--accent-primary);
            border-radius: 50%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--accent-primary),
                        inset 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .central-hub::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
            animation: scanline 3s linear infinite;
            opacity: 0.5;
        }

        .hub-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: glow 2s ease-in-out infinite;
        }

        .hub-subtitle {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hub-stats {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Rotating Ring Base */
        .orbital-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            opacity: 0.3;
        }

        .orbital-ring.ring-1 {
            width: 280px;
            height: 280px;
            animation: rotate 30s linear infinite;
        }

        .orbital-ring.ring-2 {
            width: 380px;
            height: 380px;
            animation: rotate 45s linear infinite reverse;
        }

        .orbital-ring.ring-3 {
            width: 480px;
            height: 480px;
            animation: rotate 60s linear infinite;
        }

        /* Category Segments (Radial Filter) */
        .category-segments {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .segment {
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 50%, 50% 0%, 70% 0%, 50% 50%);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .segment::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .segment:hover::before {
            opacity: 0.1;
        }

        .segment.active::before {
            opacity: 0.2;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Segment positions (72deg each for 5 categories) */
        .segment[data-category="all"] { transform: rotate(0deg); }
        .segment[data-category="pwr"] { transform: rotate(72deg); }
        .segment[data-category="def"] { transform: rotate(144deg); }
        .segment[data-category="off"] { transform: rotate(216deg); }
        .segment[data-category="mob"] { transform: rotate(288deg); }

        /* Category Labels */
        .category-label {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .segment:hover .category-label,
        .segment.active .category-label {
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-primary);
        }

        .category-label[data-category="all"] {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .category-label[data-category="pwr"] {
            top: 25%;
            right: 20px;
        }

        .category-label[data-category="def"] {
            bottom: 25%;
            right: 20px;
        }

        .category-label[data-category="off"] {
            bottom: 25%;
            left: 20px;
        }

        .category-label[data-category="mob"] {
            top: 25%;
            left: 20px;
        }

        /* Part Nodes (Orbital Positions) */
        .part-node {
            position: absolute;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 50%;
            margin-left: -50px;
            margin-top: -50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .part-node:hover {
            transform: scale(1.15) !important;
            z-index: 20;
        }

        /* Part positions around the orbit */
        .part-node[data-part="0"] {
            transform: translate(-200px, -50px);
        }
        .part-node[data-part="1"] {
            transform: translate(50px, -180px);
        }
        .part-node[data-part="2"] {
            transform: translate(200px, 50px);
        }
        .part-node[data-part="3"] {
            transform: translate(-50px, 180px);
        }

        .part-container {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5),
                        inset 0 0 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .part-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                var(--accent-primary) 50%,
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .part-node:hover .part-container::before {
            opacity: 0.1;
            animation: rotate 2s linear infinite;
        }

        .part-shape {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        .shape-box {
            width: 40px;
            height: 40px;
            background: var(--shape-box);
            box-shadow: 0 0 15px var(--shape-box);
        }

        .shape-circle {
            width: 40px;
            height: 40px;
            background: var(--shape-circle);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--shape-circle);
        }

        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid var(--shape-triangle);
            filter: drop-shadow(0 0 15px var(--shape-triangle));
        }

        .part-name {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            position: relative;
            z-index: 2;
        }

        .part-category {
            font-size: 7px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 4px;
            position: relative;
            z-index: 2;
        }

        /* Connection Lines */
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--accent-primary) 50%,
                transparent 100%
            );
            opacity: 0.2;
            pointer-events: none;
            transform-origin: left center;
        }

        .connection-line.line-1 {
            width: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-100px, 0) rotate(-15deg);
        }

        .connection-line.line-2 {
            width: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-100px, 0) rotate(75deg);
        }

        .connection-line.line-3 {
            width: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-100px, 0) rotate(165deg);
        }

        .connection-line.line-4 {
            width: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-100px, 0) rotate(-105deg);
        }

        /* Corner Grid Overlays */
        .corner-grid {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent-primary);
            opacity: 0.2;
            pointer-events: none;
        }

        .corner-grid.tl {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .corner-grid.tr {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }

        .corner-grid.bl {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }

        .corner-grid.br {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }

        /* Theme Selector */
        .theme-selector {
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 280px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .theme-selector::before,
        .theme-selector::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-primary);
        }

        .theme-selector::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .theme-selector::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .theme-selector-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .theme-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .theme-option {
            padding: 14px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-option:hover {
            border-color: var(--accent-primary);
            transform: translateX(2px);
        }

        .theme-option.active {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .theme-preview {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .theme-color {
            width: 20px;
            height: 20px;
            border-radius: 2px;
        }

        .theme-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        /* Theme Definitions */
        body.theme-cyan {
            --bg-primary: #16213e;
            --bg-secondary: #0f3460;
            --bg-tertiary: #1a4d7a;
            --bg-body: #1a1a2e;
            --accent-primary: #00d9ff;
            --accent-gradient-start: #00d9ff;
            --accent-gradient-end: #0f3460;
            --text-primary: #eee;
            --text-secondary: #6b7c8f;
            --border-color: #0f3460;
            --shape-box: #00d9ff;
            --shape-circle: #00ff88;
            --shape-triangle: #ff6b6b;
        }

        body.theme-amber {
            --bg-primary: #2d1b0e;
            --bg-secondary: #4a2f1a;
            --bg-tertiary: #6b4423;
            --bg-body: #1a0f08;
            --accent-primary: #ffa500;
            --accent-gradient-start: #ffa500;
            --accent-gradient-end: #4a2f1a;
            --text-primary: #f5e6d3;
            --text-secondary: #a67c52;
            --border-color: #4a2f1a;
            --shape-box: #ffa500;
            --shape-circle: #4ade80;
            --shape-triangle: #f87171;
        }

        body.theme-purple {
            --bg-primary: #1e1433;
            --bg-secondary: #2d1f4a;
            --bg-tertiary: #4a3370;
            --bg-body: #120c1f;
            --accent-primary: #a855f7;
            --accent-gradient-start: #a855f7;
            --accent-gradient-end: #2d1f4a;
            --text-primary: #ede9fe;
            --text-secondary: #a78bfa;
            --border-color: #2d1f4a;
            --shape-box: #a855f7;
            --shape-circle: #34d399;
            --shape-triangle: #fb7185;
        }

        body.theme-green {
            --bg-primary: #0f2818;
            --bg-secondary: #1a3d2a;
            --bg-tertiary: #285c3e;
            --bg-body: #081410;
            --accent-primary: #10b981;
            --accent-gradient-start: #10b981;
            --accent-gradient-end: #1a3d2a;
            --text-primary: #d1fae5;
            --text-secondary: #6ee7b7;
            --border-color: #1a3d2a;
            --shape-box: #10b981;
            --shape-circle: #60a5fa;
            --shape-triangle: #f59e0b;
        }

        body.theme-red {
            --bg-primary: #2d1115;
            --bg-secondary: #4a1d24;
            --bg-tertiary: #6b2a35;
            --bg-body: #1a0a0d;
            --accent-primary: #ef4444;
            --accent-gradient-start: #ef4444;
            --accent-gradient-end: #4a1d24;
            --text-primary: #fee2e2;
            --text-secondary: #fca5a5;
            --border-color: #4a1d24;
            --shape-box: #ef4444;
            --shape-circle: #22d3ee;
            --shape-triangle: #fbbf24;
        }

        body.theme-mono {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #404040;
            --bg-body: #0a0a0a;
            --accent-primary: #ffffff;
            --accent-gradient-start: #ffffff;
            --accent-gradient-end: #2d2d2d;
            --text-primary: #e5e5e5;
            --text-secondary: #999999;
            --border-color: #2d2d2d;
            --shape-box: #ffffff;
            --shape-circle: #cccccc;
            --shape-triangle: #888888;
        }

        /* Hidden state for filtered items */
        .part-node.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0) !important;
        }
    </style>
</head>
<body class="theme-cyan">
    <div class="orbital-interface">
        <!-- Rotating Background Rings -->
        <div class="orbital-ring ring-1"></div>
        <div class="orbital-ring ring-2"></div>
        <div class="orbital-ring ring-3"></div>

        <!-- Corner Grid Decorations -->
        <div class="corner-grid tl"></div>
        <div class="corner-grid tr"></div>
        <div class="corner-grid bl"></div>
        <div class="corner-grid br"></div>

        <!-- Connection Lines -->
        <div class="connection-line line-1"></div>
        <div class="connection-line line-2"></div>
        <div class="connection-line line-3"></div>
        <div class="connection-line line-4"></div>

        <!-- Category Segments (Radial Filter) -->
        <div class="category-segments">
            <div class="segment active" data-category="all">
                <div class="category-label" data-category="all">ALL</div>
            </div>
            <div class="segment" data-category="pwr">
                <div class="category-label" data-category="pwr">PWR</div>
            </div>
            <div class="segment" data-category="def">
                <div class="category-label" data-category="def">DEF</div>
            </div>
            <div class="segment" data-category="off">
                <div class="category-label" data-category="off">OFF</div>
            </div>
            <div class="segment" data-category="mob">
                <div class="category-label" data-category="mob">MOB</div>
            </div>
        </div>

        <!-- Central Hub -->
        <div class="central-hub">
            <div class="hub-title">LOADOUT</div>
            <div class="hub-subtitle">Ship Parts</div>
            <div class="hub-stats">4 / 12 SLOTS</div>
        </div>

        <!-- Part Nodes (Orbital Positions) -->
        <div class="part-node" data-part="0" data-categories="all pwr">
            <div class="part-container">
                <div class="part-shape">
                    <div class="shape-box"></div>
                </div>
                <div class="part-name">Basic<br>Generator</div>
                <div class="part-category">PWR</div>
            </div>
        </div>

        <div class="part-node" data-part="1" data-categories="all def">
            <div class="part-container">
                <div class="part-shape">
                    <div class="shape-circle"></div>
                </div>
                <div class="part-name">Shield<br>Generator</div>
                <div class="part-category">DEF</div>
            </div>
        </div>

        <div class="part-node" data-part="2" data-categories="all off">
            <div class="part-container">
                <div class="part-shape">
                    <div class="shape-triangle"></div>
                </div>
                <div class="part-name">Kinetic<br>Weapon</div>
                <div class="part-category">OFF</div>
            </div>
        </div>

        <div class="part-node" data-part="3" data-categories="all mob">
            <div class="part-container">
                <div class="part-shape">
                    <div class="shape-triangle"></div>
                </div>
                <div class="part-name">Basic<br>Engine</div>
                <div class="part-category">MOB</div>
            </div>
        </div>
    </div>

    <div class="theme-selector">
        <div class="theme-selector-title">[ Themes ]</div>
        <div class="theme-grid">
            <div class="theme-option active" data-theme="cyan">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #00d9ff;"></div>
                    <div class="theme-color" style="background: #16213e;"></div>
                    <div class="theme-color" style="background: #0f3460;"></div>
                </div>
                <div class="theme-name">Cyan</div>
            </div>

            <div class="theme-option" data-theme="amber">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ffa500;"></div>
                    <div class="theme-color" style="background: #2d1b0e;"></div>
                    <div class="theme-color" style="background: #4a2f1a;"></div>
                </div>
                <div class="theme-name">Amber</div>
            </div>

            <div class="theme-option" data-theme="purple">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #a855f7;"></div>
                    <div class="theme-color" style="background: #1e1433;"></div>
                    <div class="theme-color" style="background: #2d1f4a;"></div>
                </div>
                <div class="theme-name">Purple</div>
            </div>

            <div class="theme-option" data-theme="green">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #10b981;"></div>
                    <div class="theme-color" style="background: #0f2818;"></div>
                    <div class="theme-color" style="background: #1a3d2a;"></div>
                </div>
                <div class="theme-name">Green</div>
            </div>

            <div class="theme-option" data-theme="red">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ef4444;"></div>
                    <div class="theme-color" style="background: #2d1115;"></div>
                    <div class="theme-color" style="background: #4a1d24;"></div>
                </div>
                <div class="theme-name">Red</div>
            </div>

            <div class="theme-option" data-theme="mono">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ffffff;"></div>
                    <div class="theme-color" style="background: #1a1a1a;"></div>
                    <div class="theme-color" style="background: #2d2d2d;"></div>
                </div>
                <div class="theme-name">Mono</div>
            </div>
        </div>
    </div>

    <script>
        // Category filtering
        document.querySelectorAll('.segment').forEach(segment => {
            segment.addEventListener('click', () => {
                const category = segment.dataset.category;

                // Update active segment
                document.querySelectorAll('.segment').forEach(s => s.classList.remove('active'));
                segment.classList.add('active');

                // Filter parts
                document.querySelectorAll('.part-node').forEach(node => {
                    const categories = node.dataset.categories.split(' ');
                    if (categories.includes(category)) {
                        node.classList.remove('hidden');
                    } else {
                        node.classList.add('hidden');
                    }
                });
            });
        });

        // Theme switching
        document.querySelectorAll('.theme-option').forEach(option => {
            option.addEventListener('click', () => {
                const theme = option.dataset.theme;
                document.body.className = `theme-${theme}`;

                document.querySelectorAll('.theme-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                option.classList.add('active');
            });
        });

        // Part node click
        document.querySelectorAll('.part-node').forEach(node => {
            node.addEventListener('click', () => {
                console.log('Selected part:', node.querySelector('.part-name').textContent.trim());
            });
        });
    </script>
</body>
</html>
