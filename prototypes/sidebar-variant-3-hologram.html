<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variant 3: Holographic (Star Citizen Inspired)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #16213e;
            --bg-secondary: #0f3460;
            --bg-tertiary: #1a4d7a;
            --bg-body: #1a1a2e;
            --accent-primary: #00d9ff;
            --text-primary: #eee;
            --text-secondary: #6b7c8f;
            --border-color: #0f3460;
            --shape-box: #00d9ff;
            --shape-circle: #00ff88;
            --shape-triangle: #ff6b6b;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 3px var(--accent-primary)); }
            50% { filter: drop-shadow(0 0 8px var(--accent-primary)); }
        }

        body {
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            animation: scanline 4s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        .sidebar {
            width: 360px;
            height: 90vh;
            background: rgba(22, 33, 62, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent-primary);
            box-shadow:
                0 0 20px rgba(0, 217, 255, 0.3),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: flicker 3s ease-in-out infinite;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg,
                transparent 0%,
                rgba(0, 217, 255, 0.1) 50%,
                transparent 100%);
            pointer-events: none;
            animation: glow 2s ease-in-out infinite;
        }

        .corner-accent {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-primary);
        }
        .corner-accent.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-accent.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-accent.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-accent.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--accent-primary);
            background: linear-gradient(180deg, rgba(0, 217, 255, 0.1), transparent);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-primary);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            margin: 10px 0;
            opacity: 0.5;
        }

        .category-selector {
            padding: 12px 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-hex {
            width: 50px;
            height: 50px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-hex::before,
        .category-hex::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .category-hex::before {
            transform: rotate(0deg);
        }

        .category-hex::after {
            transform: rotate(45deg);
        }

        .category-hex:hover::before,
        .category-hex:hover::after {
            border-color: var(--accent-primary);
        }

        .category-hex.active::before,
        .category-hex.active::after {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .category-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1;
        }

        .category-hex.active .category-label {
            color: var(--accent-primary);
        }

        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .part-hologram {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-primary);
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .part-hologram::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .part-hologram:hover {
            background: rgba(26, 77, 122, 0.4);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
            transform: translateX(4px);
        }

        .part-hologram:hover::before {
            opacity: 1;
        }

        .holo-shape {
            width: 50px;
            height: 50px;
            background: rgba(22, 33, 62, 0.5);
            border: 1px solid var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .holo-shape::before,
        .holo-shape::after {
            content: '';
            position: absolute;
            border: 1px solid var(--accent-primary);
        }

        .holo-shape::before {
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            opacity: 0.3;
        }

        .holo-shape::after {
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            opacity: 0.15;
        }

        .shape-box { width: 26px; height: 26px; background: var(--shape-box); box-shadow: 0 0 10px var(--shape-box); }
        .shape-circle { width: 26px; height: 26px; background: var(--shape-circle); border-radius: 50%; box-shadow: 0 0 10px var(--shape-circle); }
        .shape-triangle { width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-bottom: 26px solid var(--shape-triangle); filter: drop-shadow(0 0 5px var(--shape-triangle)); }

        .holo-info {
            flex: 1;
        }

        .holo-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .holo-meta {
            font-size: 10px;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
        }

        .holo-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-dot {
            width: 4px;
            height: 4px;
            background: var(--accent-primary);
            box-shadow: 0 0 4px var(--accent-primary);
        }

        .footer {
            padding: 16px 20px;
            border-top: 1px solid var(--accent-primary);
            background: linear-gradient(0deg, rgba(0, 217, 255, 0.1), transparent);
        }

        .holo-button {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .holo-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-primary);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .holo-button:hover {
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .holo-button:hover::before {
            left: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 52, 96, 0.3); border-left: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); box-shadow: 0 0 5px var(--accent-primary); }

        /* Theme Selector */
        .theme-selector {
            background: var(--bg-primary);
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            width: 280px;
            align-self: flex-start;
        }

        .theme-selector-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .theme-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .theme-option {
            padding: 14px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-option:hover {
            border-color: var(--accent-primary);
            transform: translateX(2px);
        }

        .theme-option.active {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }

        .theme-preview {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .theme-color {
            width: 20px;
            height: 20px;
            border-radius: 2px;
        }

        .theme-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        /* Theme definitions */
        body.theme-cyan { --bg-primary: #16213e; --bg-secondary: #0f3460; --bg-tertiary: #1a4d7a; --bg-body: #1a1a2e; --accent-primary: #00d9ff; --text-primary: #eee; --text-secondary: #6b7c8f; --border-color: #0f3460; --shape-box: #00d9ff; --shape-circle: #00ff88; --shape-triangle: #ff6b6b; }
        body.theme-amber { --bg-primary: #2d1b0e; --bg-secondary: #4a2f1a; --bg-tertiary: #6b4423; --bg-body: #1a0f08; --accent-primary: #ffa500; --text-primary: #f5e6d3; --text-secondary: #a67c52; --border-color: #4a2f1a; --shape-box: #ffa500; --shape-circle: #4ade80; --shape-triangle: #f87171; }
        body.theme-purple { --bg-primary: #1e1433; --bg-secondary: #2d1f4a; --bg-tertiary: #4a3370; --bg-body: #120c1f; --accent-primary: #a855f7; --text-primary: #ede9fe; --text-secondary: #a78bfa; --border-color: #2d1f4a; --shape-box: #a855f7; --shape-circle: #34d399; --shape-triangle: #fb7185; }
        body.theme-green { --bg-primary: #0f2818; --bg-secondary: #1a3d2a; --bg-tertiary: #285c3e; --bg-body: #081410; --accent-primary: #10b981; --text-primary: #d1fae5; --text-secondary: #6ee7b7; --border-color: #1a3d2a; --shape-box: #10b981; --shape-circle: #60a5fa; --shape-triangle: #f59e0b; }
        body.theme-red { --bg-primary: #2d1115; --bg-secondary: #4a1d24; --bg-tertiary: #6b2a35; --bg-body: #1a0a0d; --accent-primary: #ef4444; --text-primary: #fee2e2; --text-secondary: #fca5a5; --border-color: #4a1d24; --shape-box: #ef4444; --shape-circle: #22d3ee; --shape-triangle: #fbbf24; }
        body.theme-mono { --bg-primary: #1a1a1a; --bg-secondary: #2d2d2d; --bg-tertiary: #404040; --bg-body: #0a0a0a; --accent-primary: #ffffff; --text-primary: #e5e5e5; --text-secondary: #999999; --border-color: #2d2d2d; --shape-box: #ffffff; --shape-circle: #cccccc; --shape-triangle: #888888; }
    </style>
</head>
<body class="theme-cyan">
    <div class="sidebar">
        <div class="corner-accent tl"></div>
        <div class="corner-accent tr"></div>
        <div class="corner-accent bl"></div>
        <div class="corner-accent br"></div>

        <div class="header">
            <div class="title">◆ ARSENAL ◆</div>
        </div>

        <div class="divider"></div>

        <div class="category-selector">
            <div class="category-hex active">
                <div class="category-label">ALL</div>
            </div>
            <div class="category-hex">
                <div class="category-label">PWR</div>
            </div>
            <div class="category-hex">
                <div class="category-label">DEF</div>
            </div>
            <div class="category-hex">
                <div class="category-label">OFF</div>
            </div>
            <div class="category-hex">
                <div class="category-label">MOB</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="content">
            <div class="part-hologram">
                <div class="holo-shape">
                    <div class="shape-box"></div>
                </div>
                <div class="holo-info">
                    <div class="holo-name">Generator</div>
                    <div class="holo-meta">
                        <div class="holo-stat"><div class="stat-dot"></div>PWR</div>
                        <div class="holo-stat"><div class="stat-dot"></div>BOX</div>
                        <div class="holo-stat"><div class="stat-dot"></div>2C</div>
                    </div>
                </div>
            </div>

            <div class="part-hologram">
                <div class="holo-shape">
                    <div class="shape-circle"></div>
                </div>
                <div class="holo-info">
                    <div class="holo-name">Shield</div>
                    <div class="holo-meta">
                        <div class="holo-stat"><div class="stat-dot"></div>DEF</div>
                        <div class="holo-stat"><div class="stat-dot"></div>CIRCLE</div>
                        <div class="holo-stat"><div class="stat-dot"></div>2C</div>
                    </div>
                </div>
            </div>

            <div class="part-hologram">
                <div class="holo-shape">
                    <div class="shape-triangle"></div>
                </div>
                <div class="holo-info">
                    <div class="holo-name">Weapon</div>
                    <div class="holo-meta">
                        <div class="holo-stat"><div class="stat-dot"></div>OFF</div>
                        <div class="holo-stat"><div class="stat-dot"></div>TRIANGLE</div>
                        <div class="holo-stat"><div class="stat-dot"></div>2C</div>
                    </div>
                </div>
            </div>

            <div class="part-hologram">
                <div class="holo-shape">
                    <div class="shape-triangle"></div>
                </div>
                <div class="holo-info">
                    <div class="holo-name">Engine</div>
                    <div class="holo-meta">
                        <div class="holo-stat"><div class="stat-dot"></div>MOB</div>
                        <div class="holo-stat"><div class="stat-dot"></div>TRIANGLE</div>
                        <div class="holo-stat"><div class="stat-dot"></div>2C</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="footer">
            <button class="holo-button">+ Fabricate</button>
        </div>
    </div>

    <div class="theme-selector">
        <div class="theme-selector-title">[ Themes ]</div>
        <div class="theme-grid">
            <div class="theme-option active" data-theme="cyan">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #00d9ff;"></div>
                    <div class="theme-color" style="background: #16213e;"></div>
                    <div class="theme-color" style="background: #0f3460;"></div>
                </div>
                <div class="theme-name">Cyan</div>
            </div>
            <div class="theme-option" data-theme="amber">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ffa500;"></div>
                    <div class="theme-color" style="background: #2d1b0e;"></div>
                    <div class="theme-color" style="background: #4a2f1a;"></div>
                </div>
                <div class="theme-name">Amber</div>
            </div>
            <div class="theme-option" data-theme="purple">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #a855f7;"></div>
                    <div class="theme-color" style="background: #1e1433;"></div>
                    <div class="theme-color" style="background: #2d1f4a;"></div>
                </div>
                <div class="theme-name">Purple</div>
            </div>
            <div class="theme-option" data-theme="green">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #10b981;"></div>
                    <div class="theme-color" style="background: #0f2818;"></div>
                    <div class="theme-color" style="background: #1a3d2a;"></div>
                </div>
                <div class="theme-name">Green</div>
            </div>
            <div class="theme-option" data-theme="red">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ef4444;"></div>
                    <div class="theme-color" style="background: #2d1115;"></div>
                    <div class="theme-color" style="background: #4a1d24;"></div>
                </div>
                <div class="theme-name">Red</div>
            </div>
            <div class="theme-option" data-theme="mono">
                <div class="theme-preview">
                    <div class="theme-color" style="background: #ffffff;"></div>
                    <div class="theme-color" style="background: #1a1a1a;"></div>
                    <div class="theme-color" style="background: #2d2d2d;"></div>
                </div>
                <div class="theme-name">Mono</div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.category-hex').forEach(hex => {
            hex.addEventListener('click', () => {
                document.querySelectorAll('.category-hex').forEach(h => h.classList.remove('active'));
                hex.classList.add('active');
            });
        });

        document.querySelectorAll('.theme-option').forEach(option => {
            option.addEventListener('click', () => {
                const theme = option.dataset.theme;
                document.body.className = `theme-${theme}`;
                document.querySelectorAll('.theme-option').forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });
    </script>
</body>
</html>
