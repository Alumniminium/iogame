<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Experiment 14 - Card Deck Fan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Theme System */
        body.theme-cyan {
            --accent-primary: #00d9ff;
            --accent-secondary: #0088aa;
            --accent-glow: rgba(0, 217, 255, 0.4);
        }
        body.theme-amber {
            --accent-primary: #ffa500;
            --accent-secondary: #cc8400;
            --accent-glow: rgba(255, 165, 0, 0.4);
        }
        body.theme-purple {
            --accent-primary: #a855f7;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(168, 85, 247, 0.4);
        }
        body.theme-green {
            --accent-primary: #10b981;
            --accent-secondary: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
        }
        body.theme-red {
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --accent-glow: rgba(239, 68, 68, 0.4);
        }
        body.theme-mono {
            --accent-primary: #ffffff;
            --accent-secondary: #888888;
            --accent-glow: rgba(255, 255, 255, 0.4);
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar {
            width: 340px;
            height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid var(--accent-primary);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 100;
        }

        .header h2 {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        /* Category tabs as small pills */
        .category-tabs {
            display: flex;
            gap: 6px;
            padding: 15px 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            position: relative;
        }

        .category-tab {
            padding: 6px 12px;
            font-size: 9px;
            letter-spacing: 2px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-tab:hover {
            background: rgba(40, 40, 40, 0.9);
            border-color: var(--accent-primary);
        }

        .category-tab.active {
            background: var(--accent-primary);
            color: #000;
            border-color: var(--accent-primary);
            font-weight: bold;
        }

        /* Card deck container */
        .deck-container {
            flex: 1;
            position: relative;
            padding: 40px 20px;
            overflow: visible;
        }

        /* Cards stack and fan out */
        .card-deck {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .part-card {
            position: absolute;
            width: 220px;
            height: 280px;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(30, 30, 30, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Stack cards on top of each other initially */
        .part-card {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
        }

        /* Fan out effect - each card rotates and spreads */
        .card-deck.fanned .part-card:nth-child(1) {
            transform: translate(-50%, -50%) translateY(-60px) rotate(-15deg);
        }

        .card-deck.fanned .part-card:nth-child(2) {
            transform: translate(-50%, -50%) translateY(-20px) rotate(-5deg);
        }

        .card-deck.fanned .part-card:nth-child(3) {
            transform: translate(-50%, -50%) translateY(20px) rotate(5deg);
        }

        .card-deck.fanned .part-card:nth-child(4) {
            transform: translate(-50%, -50%) translateY(60px) rotate(15deg);
        }

        .part-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 15px 50px var(--accent-glow);
            z-index: 50 !important;
            transform: translate(-50%, -50%) translateY(-10px) scale(1.05) rotate(0deg) !important;
        }

        .card-header {
            text-align: center;
            width: 100%;
        }

        .part-type-badge {
            font-size: 9px;
            color: var(--accent-primary);
            letter-spacing: 3px;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .part-name {
            font-size: 16px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .card-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            margin: 15px 0;
        }

        .part-shape {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .shape {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 3;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .card-footer {
            text-align: center;
            width: 100%;
        }

        .part-desc {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            line-height: 1.4;
        }

        /* Z-index stacking for cards */
        .part-card:nth-child(1) { z-index: 10; }
        .part-card:nth-child(2) { z-index: 11; }
        .part-card:nth-child(3) { z-index: 12; }
        .part-card:nth-child(4) { z-index: 13; }

        /* Fan toggle button */
        .fan-toggle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .fan-toggle:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Theme selector */
        .theme-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 150;
        }

        .theme-btn {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50%;
        }

        .theme-btn:hover {
            transform: scale(1.2);
            border-color: #fff;
        }

        .theme-btn.cyan { background: #00d9ff; }
        .theme-btn.amber { background: #ffa500; }
        .theme-btn.purple { background: #a855f7; }
        .theme-btn.green { background: #10b981; }
        .theme-btn.red { background: #ef4444; }
        .theme-btn.mono { background: #ffffff; }

        /* Hide cards that don't match filter */
        .part-card.hidden {
            display: none;
        }

        /* Scanline */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--accent-primary);
            opacity: 0.3;
            animation: scan 5s linear infinite;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="theme-cyan">
    <div class="sidebar">
        <div class="scanline"></div>

        <div class="theme-selector">
            <div class="theme-btn cyan" data-theme="cyan"></div>
            <div class="theme-btn amber" data-theme="amber"></div>
            <div class="theme-btn purple" data-theme="purple"></div>
            <div class="theme-btn green" data-theme="green"></div>
            <div class="theme-btn red" data-theme="red"></div>
            <div class="theme-btn mono" data-theme="mono"></div>
        </div>

        <div class="header">
            <h2>Part Library</h2>
        </div>

        <div class="category-tabs">
            <div class="category-tab active" data-category="all">ALL</div>
            <div class="category-tab" data-category="PWR">PWR</div>
            <div class="category-tab" data-category="DEF">DEF</div>
            <div class="category-tab" data-category="OFF">OFF</div>
            <div class="category-tab" data-category="MOB">MOB</div>
        </div>

        <div class="deck-container">
            <div class="card-deck fanned">
                <div class="part-card" data-type="PWR">
                    <div class="card-header">
                        <div class="part-type-badge">POWER SYSTEMS</div>
                        <div class="part-name">Generator</div>
                        <div class="card-divider"></div>
                    </div>
                    <div class="part-shape">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <rect class="shape" x="20" y="20" width="60" height="60" />
                        </svg>
                    </div>
                    <div class="card-footer">
                        <div class="part-desc">Core energy<br/>generation unit</div>
                    </div>
                </div>

                <div class="part-card" data-type="DEF">
                    <div class="card-header">
                        <div class="part-type-badge">DEFENSE SYSTEMS</div>
                        <div class="part-name">Shield</div>
                        <div class="card-divider"></div>
                    </div>
                    <div class="part-shape">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <circle class="shape" cx="50" cy="50" r="30" />
                        </svg>
                    </div>
                    <div class="card-footer">
                        <div class="part-desc">Protective energy<br/>barrier system</div>
                    </div>
                </div>

                <div class="part-card" data-type="OFF">
                    <div class="card-header">
                        <div class="part-type-badge">OFFENSE SYSTEMS</div>
                        <div class="part-name">Weapon</div>
                        <div class="card-divider"></div>
                    </div>
                    <div class="part-shape">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <polygon class="shape" points="50,20 80,80 20,80" />
                        </svg>
                    </div>
                    <div class="card-footer">
                        <div class="part-desc">Primary weapons<br/>array module</div>
                    </div>
                </div>

                <div class="part-card" data-type="MOB">
                    <div class="card-header">
                        <div class="part-type-badge">MOBILITY SYSTEMS</div>
                        <div class="part-name">Engine</div>
                        <div class="card-divider"></div>
                    </div>
                    <div class="part-shape">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                            <polygon class="shape" points="50,80 80,20 20,20" />
                        </svg>
                    </div>
                    <div class="card-footer">
                        <div class="part-desc">Advanced thrust<br/>propulsion unit</div>
                    </div>
                </div>
            </div>

            <button class="fan-toggle">COLLAPSE DECK</button>
        </div>
    </div>

    <script>
        // Theme switching
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.body.className = `theme-${theme}`;
            });
        });

        // Fan toggle
        const fanToggle = document.querySelector('.fan-toggle');
        const cardDeck = document.querySelector('.card-deck');
        let isFanned = true;

        fanToggle.addEventListener('click', () => {
            isFanned = !isFanned;
            if (isFanned) {
                cardDeck.classList.add('fanned');
                fanToggle.textContent = 'COLLAPSE DECK';
            } else {
                cardDeck.classList.remove('fanned');
                fanToggle.textContent = 'FAN OUT DECK';
            }
        });

        // Category filtering
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Filter parts
                const category = tab.dataset.category;
                const parts = document.querySelectorAll('.part-card');
                parts.forEach(part => {
                    if (category === 'all' || part.dataset.type === category) {
                        part.classList.remove('hidden');
                    } else {
                        part.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
